<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Area Allenatore/Dirigente — D.S.D.</title>

  <!-- Librerie salvate nella cartella (versione fissa, funziona anche senza internet) -->
  <script src="js/vendor/tailwind-browser.js"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-[#F2F4F4] text-[#12181B] antialiased">

  <!-- Barra del prototipo per passare da un'area all'altra -->
  <div id="barra-aree"></div>

  <!-- ================================================================== -->
  <!-- INTESTAZIONE                                                       -->
  <!-- ================================================================== -->

    <div class="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3 min-w-0">
        <span class="h-10 flex items-center shrink-0">
            <svg class="w-[58px] h-auto" viewBox="0 0 225.73 79.76" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <style>
                  .cls-1 { fill: #4f9eaf; }
                  .cls-2 { fill: #7dcad7; }
                </style>
              </defs>
              <g id="Livello_1-2" data-name="Livello 1">
                <g>
                  <polygon class="cls-1" points="116.88 27.21 146.17 27.2 139.57 0 110.29 0 116.88 27.21"/>
                  <polygon class="cls-1" points="92.91 79.76 122.19 79.76 115.61 52.56 86.53 52.56 92.91 79.76"/>
                  <polygon class="cls-1" points="28.17 40.56 22.88 18.56 30.21 18.56 33.75 18.56 29.29 0 0 0 10.71 44.54 19.16 79.76 48.44 79.76 44 61.21 33.12 61.21 28.17 40.56"/>

                  <polygon class="cls-1" points="175.09 40.56 169.8 18.56 177.14 18.56 180.67 18.56 176.21 0 146.92 0 157.64 44.54 166.08 79.76 195.36 79.76 190.92 61.21 180.04 61.21 175.09 40.56"/>
                  <path class="cls-2" d="M225.08,51.28l-1.61-6.73-6.46-26.85C214.51,7.32,205.23,0,194.55,0h-11.09s4.46,18.55,4.46,18.55h6.18c2.69,0,5.01,1.83,5.64,4.44l5.98,24.84,1.49,6.21c.11.47.17.94.17,1.39,0,2.77-2.22,5.75-5.81,5.75h-3.4s4.45,18.55,4.45,18.55h0c14.93,0,25.94-13.96,22.46-28.48Z"/>

                </g>
              </g>

        </span>
        <span class="flex items-center gap-2 border-l border-[#E7EBEC] pl-3 min-w-0">
          <img id="area-logo-societa" alt="" class="hidden h-7 w-7 object-contain shrink-0" />
          <span class="min-w-0">
            <span id="area-nome-societa" class="block text-sm font-bold text-[#12181B] truncate"></span>
            <span class="block font-mono text-[10px] uppercase text-[#4E9EAF]">Area Allenatore/Dirigente</span>
          </span>
        </span>
      </div>
    </div>
    <!-- Nel prototipo si sceglie chi è entrato; con il server lo dirà il login -->
    <div class="max-w-3xl mx-auto px-4 pb-2">
      <label class="flex items-center gap-2 text-[10px] font-mono uppercase text-[#7A8285]">
        <span class="shrink-0">Accesso come</span>
        <select id="scelta-allenatore" class="input-dsd py-1 text-xs flex-1 sm:flex-none sm:w-72"></select>
      </label>
    </div>
    <nav class="max-w-3xl mx-auto px-4 flex text-xs font-bold text-[#7A8285] overflow-x-auto">
      <button type="button" data-scheda="squadre" class="voce-area">Squadre</button>
      <button type="button" data-scheda="allenamenti" class="voce-area">Allenamenti</button>
      <button type="button" data-scheda="presenze" class="voce-area">Presenze</button>
      <button type="button" data-scheda="convocazioni" class="voce-area">Convocazioni</button>
      <button type="button" data-scheda="materiale" class="voce-area">Materiale</button>
    </nav>
  </header>

  <main id="area-contenuto" class="max-w-3xl w-full mx-auto px-4 py-6">
    <!-- Dinamico JS -->
  </main>

  <footer class="max-w-3xl mx-auto px-4 py-6 text-[11px] text-[#7A8285] font-mono">
    Digital Sports Desk • Portale v4 • Qui non compaiono quote, codici fiscali, indirizzi e documenti sanitari
  </footer>

  <!-- Finestra di conferma (al posto del confirm del browser) -->
  <div id="finestra-conferma" class="finestra fixed inset-0 bg-[#12181B]/80 flex items-center justify-center hidden z-[70] p-4 backdrop-blur-xs" data-chiudi-fuori>
    <div class="bg-white p-6 rounded-sm w-full max-w-sm shadow-2xl border border-[#E7EBEC]" role="alertdialog" aria-labelledby="conferma-titolo">
      <h3 id="conferma-titolo" class="text-xl font-bold mb-2 text-[#12181B]"></h3>
      <p id="conferma-testo" class="text-sm text-[#7A8285] leading-relaxed"></p>
      <div class="flex justify-end gap-3 mt-6">
        <button id="conferma-no" type="button" class="btn-dsd-secondary text-xs py-2 px-4">Annulla</button>
        <button id="conferma-si" type="button" class="btn-dsd-primary text-xs py-2 px-5">Conferma</button>
      </div>
    </div>
  </div>

  <div id="avvisi" class="avvisi" aria-live="polite"></div>

  <!-- Le stesse funzioni della segreteria, più quelle dell'area -->
  <script src="js/dialoghi.js"></script>
  <script src="js/atleti.js"></script>
  <script src="js/allenatori.js"></script>
  <script src="js/magazzino.js"></script>
  <script src="js/promemoria.js"></script>
  <script src="js/allenamenti.js"></script>
  <script src="js/aree.js"></script>
  <script src="js/main.js"></script>
  <script src="js/area-allenatore.js"></script>
</body>
</html>
